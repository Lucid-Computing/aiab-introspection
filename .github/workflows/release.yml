# Put what is on production live: run the release procedure (static/deploy/tinfoil/audit/release.py)
# from CI instead of an operator's laptop. Started by a merge into production, then:
# build-image.yml on the production branch, measured config pushed to the public config repo,
# Tinfoil told to run the new tag, the live box asked for its identity and health, and the
# new release pins committed back to production so the UI and clients know what runs.
#
# Repository secrets:
#   TINFOIL_API_KEY    Lucid's Tinfoil control-plane key (what ~/.tinfoil/config.json holds)
#   RELEASE_GH_TOKEN   a token that may run workflows and download runs in this repository and
#                      push commits/tags and download releases in the public config repository
#   AUDIT_LAB_TOKEN    the lab API token, for the live verification step
#   AUDIT_LOGGER_KEY   the demo logger private key (no longer used by the release; kept for now)
name: Release to the live box
run-name: "Release ${{ inputs.new_box || 'default' }} · ${{ inputs.source_commit || github.sha }}"
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag vMAJOR.MINOR.PATCH (empty: bump the patch of the current tag)'
        required: false
        type: string
      source_commit:
        description: "Approved source commit (empty: dispatch/push commit)"
        required: false
        type: string
      new_box:
        description: "New box name (empty: update the default box); existing boxes stay running"
        required: false
        type: string
      dry_run:
        description: 'Plan only: check the secrets and preconditions, touch nothing'
        required: false
        type: boolean
        default: false
  # A push to production starts the release whenever it changes anything that goes into the
  # box image: the plan, the static part (code, trust keys, dependencies, the Dockerfile and
  # release tooling) or the build's ignore file. Merges made by approve-plan.yml and
  # approve-keys.yml do not count as pushes here (GitHub's rule for the workflow token), so
  # those workflows start this one by dispatch after merging. UI, docs and workflow edits
  # never reach the box, so they do not release. The pins commit below says [skip ci], so it
  # does not start another one. The Actions tab button remains for re-runs and dry runs.
  push:
    branches: [production]
    paths: ['plan/**', 'static/**', '!static/deploy/tinfoil/audit/boxes/**', '.dockerignore']
concurrency:
  group: audit-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.6"
      - name: Install credentials for this job only
        env:
          TINFOIL_API_KEY: ${{ secrets.TINFOIL_API_KEY }}
          AUDIT_LAB_TOKEN: ${{ secrets.AUDIT_LAB_TOKEN }}
          AUDIT_LOGGER_KEY: ${{ secrets.AUDIT_LOGGER_KEY }}
        run: |
          umask 077
          test -n "$TINFOIL_API_KEY" && test -n "$AUDIT_LAB_TOKEN" && test -n "$AUDIT_LOGGER_KEY"
          mkdir -p ~/.tinfoil "$RUNNER_TEMP/keys"
          printf '{"controlplane_url":"https://api.tinfoil.sh","api_key":"%s"}\n' "$TINFOIL_API_KEY" > ~/.tinfoil/config.json
          printf '%s\n' "$AUDIT_LAB_TOKEN" > "$RUNNER_TEMP/keys/lab.token"
          printf '%s\n' "$AUDIT_LOGGER_KEY" > "$RUNNER_TEMP/keys/logger.key"
      - name: The plan on production must be signed with the keys production trusts
        working-directory: static
        run: |
          # The box verifies these signatures at start-up with the same trust entry. If they
          # do not match, a release would leave the box unable to start, so stop here.
          uv sync --locked
          uv run --locked python -m auditor.baked --folder ../plan --trust aiab/baked/trust.json verify \
            || { echo "::error::plan/ on production is not signed by the keys in static/aiab/baked/trust.json. Sign the plan with the trusted keys and deploy it; that deploy releases both together."; exit 1; }
      - name: Do not implicitly replace the default with another box's plan
        if: github.event_name == 'push'
        working-directory: static
        run: |
          uv run --locked python -m auditor.baked --folder ../plan --trust aiab/baked/trust.json digest > "$RUNNER_TEMP/selected-plan.json"
          python3 - <<'PY_CHECK'
          import json, os
          from pathlib import Path
          selected = json.loads((Path(os.environ['RUNNER_TEMP']) / 'selected-plan.json').read_text())
          default = json.loads(Path('deploy/tinfoil/audit/release.json').read_text())
          if selected['plan_digest'] != default['plan_digest']:
              raise SystemExit('The selected plan differs from the default box. Use Deploy or an explicit release workflow dispatch to update the default; automatic pushes do not replace it with another box’s plan.')
          PY_CHECK
      - name: Choose the tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          REQUESTED: ${{ inputs.tag }}
        run: |
          if [ -n "$REQUESTED" ]; then
            TAG="$REQUESTED"
          else
            # The patch after the highest tag the config repository already has. Tags are
            # never reused, and the repository's own record can lag the box (a run that
            # deployed but did not finish), so the record is only the fallback.
            CONFIG_REPO=$(python3 -c "import json; print(json.load(open('static/deploy/tinfoil/audit/release.json'))['repo'])")
            TAG=$(gh api "repos/$CONFIG_REPO/tags" --paginate --jq '.[].name' | python3 -c "
          import json, re, sys
          pattern = re.compile(r'^v(\d+)\.(\d+)\.(\d+)$')
          tags = [tuple(map(int, m.groups())) for m in map(pattern.match, sys.stdin.read().split()) if m]
          if not tags:
              tags = [tuple(map(int, pattern.match(json.load(open('static/deploy/tinfoil/audit/release.json'))['tag']).groups()))]
          a, b, c = max(tags)
          print(f'v{a}.{b}.{c + 1}')")
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Run the release procedure
        working-directory: static
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          NEW_BOX: ${{ inputs.new_box }}
        run: |
          uv sync --locked
          git config --global user.name "AIAB release"
          git config --global user.email "aiab-release@users.noreply.github.com"
          gh auth setup-git
          EXECUTE=--execute
          if [ "${{ inputs.dry_run }}" = "true" ]; then EXECUTE=""; echo "Dry run: planning only" >> "$GITHUB_STEP_SUMMARY"; fi
          TARGET=()
          if [ -n "$NEW_BOX" ]; then TARGET=(--new-box "$NEW_BOX"); fi
          uv run --locked python deploy/tinfoil/audit/release.py "${TARGET[@]}" \
            $EXECUTE --source-ref production --source-commit "$(git rev-parse HEAD)" --tag "${{ steps.tag.outputs.tag }}" \
            --key-directory "$RUNNER_TEMP/keys" --output "$RUNNER_TEMP/release-out"
      - name: Commit the new release pins to production
        # Runs even when the health check after the deploy failed: release.py writes
        # release.json only once the box has been redeployed, so if that file exists the live
        # box changed and the repository records it. The UI and the clients read these pins
        # to know which box to expect.
        if: ${{ !cancelled() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          NEW_BOX: ${{ inputs.new_box }}
        run: |
          if [ ! -f "$RUNNER_TEMP/release-out/release.json" ]; then
            echo "No deployment happened in this run; nothing to record." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config --global user.name "AIAB release"
          git config --global user.email "aiab-release@users.noreply.github.com"
          if [ -n "$NEW_BOX" ]; then
            [[ "$NEW_BOX" =~ ^[a-z][a-z0-9-]{0,39}$ ]] && [ "$NEW_BOX" != default ]
            mkdir -p static/deploy/tinfoil/audit/boxes
            test ! -e "static/deploy/tinfoil/audit/boxes/$NEW_BOX.json"
            cp "$RUNNER_TEMP/release-out/release.json" "static/deploy/tinfoil/audit/boxes/$NEW_BOX.json"
            git add "static/deploy/tinfoil/audit/boxes/$NEW_BOX.json"
          else
            cp "$RUNNER_TEMP/release-out/release.json" static/deploy/tinfoil/audit/release.json
            for file in tinfoil-config.yml trust.json manifest.json policy-digest.txt; do
              cp "$RUNNER_TEMP/release-out/config/$file" "static/deploy/tinfoil/audit/$file"
            done
            git add static/deploy/tinfoil/audit/release.json \
              static/deploy/tinfoil/audit/tinfoil-config.yml \
              static/deploy/tinfoil/audit/trust.json \
              static/deploy/tinfoil/audit/manifest.json \
              static/deploy/tinfoil/audit/policy-digest.txt
          fi
          git commit -m "Release ${{ steps.tag.outputs.tag }}: update pins [skip ci]"
          git fetch origin production
          git rebase origin/production
          git push origin HEAD:production
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()   # on failure the journal holds the reason
        with:
          name: release-${{ steps.tag.outputs.tag }}
          path: ${{ runner.temp }}/release-out/
          if-no-files-found: error
