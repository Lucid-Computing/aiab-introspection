# The agreement UI's image for the Render services, which are image-backed: pushing a branch
# alone does not deploy them. Every push to an environment branch (production, staging) that
# touches what ui/Dockerfile copies builds ghcr.io/lucid-computing/aiab-ui from that branch,
# tagged with the commit and the branch name (production also as latest), then asks that
# branch's Render service to deploy the exact digest through its deploy hook (repository
# secrets RENDER_DEPLOY_HOOK_URL for production, RENDER_DEPLOY_HOOK_URL_STAGING for staging;
# without a hook the image is pushed but not deployed). The UI carries the box's own code
# (static/aiab) for the plan checks on its pages, so it is built from the same branch as the
# box it serves. Master is never deployed; a manual run on it only pushes a :master tag.
name: Build agreement UI image
on:
  push:
    branches: [production, staging]
    paths:
      - 'ui/**'
      - 'static/pyproject.toml'
      - 'static/uv.lock'
      - 'static/README.md'
      - 'static/aiab/**'
      - 'static/auditor/**'
      - 'static/deploy/tinfoil/audit/release.json'
      - '.github/workflows/build-ui-image.yml'
  workflow_dispatch:
concurrency:
  group: ui-image-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/lucid-computing/aiab-ui
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags for this branch
        id: tags
        run: |
          TAGS="$IMAGE:$GITHUB_SHA,$IMAGE:$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_NAME" = production ]; then TAGS="$TAGS,$IMAGE:latest"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        id: build
        with:
          context: .
          file: ui/Dockerfile
          platforms: linux/amd64   # Render runs amd64 only
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Links the package to this repository, so this workflow's token may push to it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Deploy the digest on this branch's Render service
        env:
          HOOK_PRODUCTION: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          HOOK_STAGING: ${{ secrets.RENDER_DEPLOY_HOOK_URL_STAGING }}
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          echo "$REF" >> "$GITHUB_STEP_SUMMARY"
          case "$GITHUB_REF_NAME" in
            production) HOOK="$HOOK_PRODUCTION" ;;
            staging) HOOK="$HOOK_STAGING" ;;
            *) HOOK="" ;;
          esac
          if [ -z "$HOOK" ]; then
            echo "No deploy hook for $GITHUB_REF_NAME; image pushed, not deployed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -fsS -X POST -G "$HOOK" --data-urlencode "imgURL=$REF" -o /dev/null
          echo "Render deploy requested for $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
