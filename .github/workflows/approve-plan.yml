name: Verify jointly signed plan change
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [production, dev]   # plans are deployed only through an environment branch
    paths: ['plan/**']
permissions:
  contents: write
  pull-requests: write
  actions: write   # to start release.yml after the merge
concurrency:
  group: signed-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      # Only trusted base code runs. Never check out, import or execute PR Python.
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.11.6'
      - name: Fetch immutable candidate and verify with base keys
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          gh auth setup-git
          git fetch origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          uv sync --project static --locked
          PYTHONPATH=static static/.venv/bin/python static/deploy/check_plan_pr.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Put the verified plan on top of the base branch as it is now, then merge
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # The base branch may have moved since the pull request was opened (a release wrote
          # new pins, another plan or a key landed). The newest base always wins: the verified
          # plan/ is re-created on its tip, checked again there, and that is merged.
          git fetch --quiet origin "$BASE_REF"
          TIP=$(git rev-parse FETCH_HEAD)
          if [ "$TIP" != "$BASE_SHA" ]; then
            echo "$BASE_REF moved from $BASE_SHA to $TIP; re-basing the plan on it"
            git checkout --quiet --detach "$TIP"
            git rm -r --quiet plan
            git checkout --quiet "$HEAD_SHA" -- plan
            git -c user.name="AIAB plan check" -c user.email="aiab-plan-check@users.noreply.github.com" \
              commit --quiet -m "Deploy plan (same files, re-based on $BASE_REF $TIP)"
            HEAD_SHA=$(git rev-parse HEAD)
            PYTHONPATH=static static/.venv/bin/python static/deploy/check_plan_pr.py --base "$TIP" --head "$HEAD_SHA"
            git push --quiet --force origin "HEAD:refs/heads/$HEAD_REF"
            BASE_SHA=$TIP
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE_REF" --jq .object.sha)" = "$BASE_SHA"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --match-head-commit "$HEAD_SHA" --squash
          # A push made with the workflow token starts no other workflow (GitHub's rule against
          # loops), so the release is started here explicitly; a dispatch is allowed.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$BASE_REF"
