name: Verify jointly signed plan change
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [production]   # plans are deployed only through the production branch
    paths: ['plan/**']
    branches: [production]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: signed-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      # Only trusted base code runs. Never check out, import or execute PR Python.
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.11.6'
      - name: Fetch immutable candidate and verify with base keys
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          gh auth setup-git
          git fetch origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          uv sync --project static --locked
          PYTHONPATH=static static/.venv/bin/python static/deploy/check_plan_pr.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Merge only the verified head under repository protection
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE_REF" --jq .object.sha)" = "$BASE_SHA"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --match-head-commit "$HEAD_SHA" --squash
          # The merge is a push to production; release.yml picks it up and runs the build itself.
