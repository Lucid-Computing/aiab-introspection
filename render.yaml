# Render blueprint for the agreement UI: one Docker web service with a persistent disk.
# Create the service from this file in the Render dashboard ("New > Blueprint"), then set
# the secrets marked sync: false. See ui/README.md, "Deploying on Render".
services:
  - type: web
    name: aiab-agreement-ui
    runtime: docker
    plan: starter               # the smallest plan that allows a persistent disk
    region: frankfurt
    branch: master              # contains the current UI and runtime fixes
    dockerfilePath: ./ui/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    disk:
      name: aiab-data
      mountPath: /data          # the git checkout, accounts, trust file, runs
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY  # server-side key for plan authoring with Claude Opus 5.5
        sync: false
      - key: AIAB_REPO
        value: Lucid-Computing/aiab-introspection
      - key: AIAB_CHECKOUT_BRANCH
        value: production       # the branch the image is built from; the UI works on its agreements/ and plan/
      - key: AIAB_AUTO_PULL
        value: "1"              # the checkout follows production every minute when clean
      - key: AIAB_DEPLOY_BASE
        value: production       # Deploy opens its plan pull request against this branch
      - key: UI_SESSION_SECRET
        generateValue: true
      - key: GITHUB_TOKEN       # fine-grained token or bot token: contents read/write, pull requests read/write
        sync: false
      - key: UI_BOOTSTRAP_ACCOUNTS   # local password accounts, "lab@lab.com:lab:<password>,..."; new names added on every start, existing ones untouched
        sync: false
      - key: AIAB_LAB_KEY       # optional: a lab signing key (base64 raw Ed25519); with its certificate below, the server signs every plan version as the lab
        sync: false
      - key: AIAB_LAB_CERTIFICATE  # optional: the certificate the lab root made for AIAB_LAB_KEY (one JSON line, sign_digest.py certify)
        sync: false
      - key: AIAB_AUDITOR_ROOT_KEY  # optional, prototype: the auditor root's private key (base64 raw Ed25519); the server certifies each auditor's browser key on their first Sign
        sync: false
      - key: LAB_TOKEN          # optional, for the Runs screen: the lab's API token for the box
        sync: false
      - key: LOGGER_KEY         # optional, for the Runs screen: the demo logger's private key (base64)
        sync: false
      - key: AIAB_LOG_KEY       # optional, for the Logs screen: production's log reader key (LOG_READER_KEY in 1Password); Prod Agent Logs
        sync: false
      - key: AIAB_PROXY_KEY     # optional, for the Logs screen: the test proxy's shared key ("tester:<key>" or the key alone); Dev Agent Logs
        sync: false
      - key: AIAB_SLACK_EXPORT_KEY  # optional, for the Logs screen: opens the committed Slack export bundle (slack-export-bundle in 1Password); Slack Logs
        sync: false
      - key: AIAB_GITHUB_EXPORT_KEY  # optional, for the Logs screen: opens the committed GitHub export bundle (github-export-bundle in 1Password); GitHub Logs
        sync: false
