# Render blueprint for the agreement UI: one Docker web service with a persistent disk.
# Create the service from this file in the Render dashboard ("New > Blueprint"), then set
# the secrets marked sync: false. See ui/README.md, "Deploying on Render".
services:
  - type: web
    name: aiab-ui-dev
    runtime: docker
    plan: starter               # the smallest plan that allows a persistent disk
    region: frankfurt
    branch: dev              # contains the current UI and runtime fixes
    dockerfilePath: ./ui/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    disk:
      name: aiab-data
      mountPath: /data          # the git checkout, accounts, trust file, runs
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY  # server-side key for plan authoring with Claude Opus 5.5
        sync: false
      - key: AIAB_REPO
        value: Lucid-Computing/aiab-introspection
      - key: AIAB_CHECKOUT_BRANCH
        value: dev       # the branch the box is built from; the UI reads its release pins and trust file
      - key: AIAB_AUTO_PULL
        value: "1"              # the checkout follows production every minute when clean
      - key: AIAB_DEPLOY_BASE
        value: dev       # a key submission opens its pull request against this branch
      - key: UI_SESSION_SECRET
        generateValue: true
      - key: OIDC_ISSUER            # Okta login: the org's issuer, e.g. https://lucid.okta.com; all three set = Okta, none = local accounts
        sync: false
      - key: OIDC_CLIENT_ID         # the Okta app integration's client ID
        sync: false
      - key: OIDC_CLIENT_SECRET     # ... and its client secret
        sync: false
      - key: UI_PARTIES             # optional: "teddy@lucid.example:lab,caleb@other.example:auditor"; or `python -m server.auth party` in the shell
        sync: false
      - key: GITHUB_TOKEN       # fine-grained token or bot token: contents read/write, pull requests read/write
        sync: false
      - key: UI_BOOTSTRAP_ACCOUNTS   # local password accounts, first boot only: "demo:auditor:<password>,..."; work next to Okta
        sync: false
      - key: LAB_TOKEN          # optional, for the Runs screen: the lab's API token for the box
        sync: false
      - key: LOGGER_KEY         # optional, for the Runs screen: the demo logger's private key (base64)
        sync: false
      - key: AIAB_LOG_KEY       # optional, for the Logs screen: production's log reader key (LOG_READER_KEY in 1Password); wins over AIAB_PROXY_KEY
        sync: false
      - key: AIAB_PROXY_KEY     # optional, for the Logs screen: the test proxy's shared key ("tester:<key>" or the key alone)
        sync: false
