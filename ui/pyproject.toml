[project]
name = "aiab-ui"
version = "0.1.0"
description = "Agreement UI for AIAB: edit, dry-run, sign and track the plan"
requires-python = ">=3.12"
dependencies = [
    # The plan tooling the box and CI use: digest, checks, signatures, dry run.
    "aiab-introspection",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "jinja2>=3.1,<4",
    # Form posts and signature-file uploads.
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9,<1",
    "pytest>=8,<10",
]

[tool.uv.sources]
aiab-introspection = { path = "../static", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
