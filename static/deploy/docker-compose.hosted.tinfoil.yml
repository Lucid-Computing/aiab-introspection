# Optional hosted classifier overlay; layer after hosted.yml and hosted.anthropic.yml.
# Always use --env-file /dev/null. The only new host input is a private file path.
# The documented base files omit legacy key variables. Additional overlays are not
# sanitized by this file; configuring both credential sources fails app startup.
services:
  aiab:
    environment:
      AIAB_MODE: local
      ENFORCEMENT_MODE: block
      TINFOIL_API_KEY_FILE: /run/secrets/tinfoil_api_key
      CLASSIFIER_MODEL: gpt-oss-safeguard-120b
    # SDK/Sigstore public verification caches need writable XDG paths in /tmp.
    # Preserve the read-only root; no cache or conversation volume is persisted.
    tmpfs:
      - /tmp:size=256m,mode=1777,nosuid,nodev,noexec
    secrets:
      - source: tinfoil_api_key
        target: tinfoil_api_key

secrets:
  tinfoil_api_key:
    file: ${AIAB_TINFOIL_KEY_FILE:?Set AIAB_TINFOIL_KEY_FILE to an absolute private host file path}
