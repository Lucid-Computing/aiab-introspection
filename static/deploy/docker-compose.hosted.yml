# Hosted, non-attested demo. Always invoke with --env-file /dev/null (make hosted-up).
name: aiab-hosted-demo

services:
  inference:
    extends:
      file: docker-compose.local.yml
      service: inference
    restart: unless-stopped

  aiab:
    extends:
      file: docker-compose.local.yml
      service: aiab
    restart: unless-stopped
    environment:
      AIAB_ID: aiab-hosted-demo
      ENFORCEMENT_MODE: block
      BLOCK_THRESHOLD: "0.8"
      # Caddy serves both UI and API on one origin. Never inherit shell secrets.
      CORS_ALLOW_ORIGIN: ""
      CLASSIFIER_MODEL: mock-keywords/v1
    logging:
      driver: none

  webchat:
    image: aiab-webchat:local
    build:
      context: ../webchat
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AIAB_URL: https://jonathan.quest/aiab-introspection/api
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      aiab:
        condition: service_healthy
    logging:
      driver: none
