[project]
name = "aiab-introspection"
version = "0.1.0"
description = "The audit box (static part) and the auditor command-line tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The box's HTTP routes and request validation.
    "fastapi>=0.115,<1",
    # ASGI serving.
    "uvicorn>=0.34,<1",
    # Async requests from the auditor tool and the model transport.
    "httpx>=0.28,<1",
    # Ed25519 signatures: plan, record export, report.
    "cryptography>=44,<47",
    # Attested transport to the box and to the model; never plain REST.
    "tinfoil==0.14.0",
    "jsonschema>=4.23,<5",
    "rfc8785==0.1.4",
]

[dependency-groups]
dev = [
    # Regression tests for the box, the plan checker and the auditor tool.
    "pytest>=8,<10",
    # Async runtime tests.
    "pytest-asyncio>=0.25,<2",
    # Shared lint and formatting checks.
    "ruff>=0.9,<1",
]

[project.scripts]
aiab-audit = "aiab.audit.main:main"
aiab-plan = "auditor.audit:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiab", "auditor"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
