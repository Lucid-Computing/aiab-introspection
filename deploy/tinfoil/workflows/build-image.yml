# Manual publication only; keep this workflow in the PRIVATE source repository.
name: Build reviewed enclave image
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Reviewed lowercase ghcr.io/owner/image name'
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Validate publication destination
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          [[ "$IMAGE" =~ ^ghcr.io/[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9._-]*$ ]]
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.26.2@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          no-cache: true
          provenance: false
          sbom: false
          build-args: SOURCE_DATE_EPOCH=0
          outputs: type=image,name=${{ inputs.image }}:${{ github.sha }},push=true,oci-mediatypes=true,rewrite-timestamp=true,compression=gzip,compression-level=6,force-compression=true
      - name: Record the registry digest
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
